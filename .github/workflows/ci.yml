name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps (including the real quaddtype
          package used to live-reproduce numpy/numpy#32671)
        run: python -m pip install -e ".[dev,quaddtype]"
      - name: Run tests
        run: python -m pytest -v --cov=numpy_einsum_newdtype_guard --cov-report=term-missing
      - name: Smoke-test installed console script
        run: |
          numpy-einsum-newdtype-guard --version
          set +e
          numpy-einsum-newdtype-guard detect --json > /tmp/detect-out.json
          code=$?
          set -e
          echo "detect exit=$code"
          # 0 = not affected, 1 = confirmed affected, 2 = quaddtype missing
          # (should not happen here since we just installed it above).
          test "$code" -eq 0 -o "$code" -eq 1
          python3 -m json.tool /tmp/detect-out.json

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/numpy-einsum-newdtype-guard --version
          set +e
          /tmp/smoke-venv/bin/numpy-einsum-newdtype-guard detect --json > /tmp/smoke-out.json
          code=$?
          set -e
          echo "detect exit=$code"
          # 2 is expected here: quaddtype is NOT installed in this bare
          # smoke venv, and detect must report that cleanly, not crash.
          test "$code" -eq 0 -o "$code" -eq 1 -o "$code" -eq 2
          python3 -m json.tool /tmp/smoke-out.json
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
