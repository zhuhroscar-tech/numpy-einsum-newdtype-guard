[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-einsum-newdtype-guard"
version = "0.1.0"
description = "Detects and works around a real numpy bug: np.einsum silently returns wrong results (or crashes) for new-style dtype operands (numpy/numpy#32671)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
quaddtype = ["numpy_quaddtype; python_version >= '3.11'"]

[project.scripts]
numpy-einsum-newdtype-guard = "numpy_einsum_newdtype_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
